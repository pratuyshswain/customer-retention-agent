name: Engineering checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Ruff correctness gate
        run: python -m ruff check --select E9,F63,F7,F82 src data/generate_dataset.py run_server.py tests
      - name: Static type checks
        run: python -m mypy --ignore-missing-imports --follow-imports=silent --check-untyped-defs src data/generate_dataset.py run_server.py
      - name: Coverage report
        run: python -m pytest tests -q --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: High-confidence high-severity Bandit gate
        run: python -m bandit -r src data/generate_dataset.py run_server.py -lll -iii
      - name: Audit runtime dependency resolution
        run: python -m pip_audit -r requirements.txt
